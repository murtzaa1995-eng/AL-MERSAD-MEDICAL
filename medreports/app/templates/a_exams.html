{% extends 'base.html' %}{% block content %}<h1>أنواع الفحوصات والأسعار</h1><p class="hint">السعر الأساسي هو سعر المريض المباشر، ويُستخدم للمستشفيات التي ليس لها سعر خاص.</p>
<div class="scroll"><table><tr><th>النوع</th><th>المنطقة</th><th>السعر الأساسي</th><th>فعّال</th><th></th></tr>
{% for e in rows %}<tr><form method="post">{{ m.csrf() }}<input type="hidden" name="id" value="{{ e['id'] }}"><td><select name="modality">{% for k,v in MODALITIES.items() %}<option value="{{ k }}" {{ 'selected' if k==e['modality'] }}>{{ v }}</option>{% endfor %}</select></td>
<td><input name="region" value="{{ e['region'] }}"></td><td><input name="base_price" type="number" min="0" value="{{ e['base_price'] }}"></td><td><input type="checkbox" name="active" {{ 'checked' if e['active'] }}></td><td><button class="btn sm">حفظ</button></td></form></tr>{% endfor %}
<tr><form method="post">{{ m.csrf() }}<td><select name="modality">{% for k,v in MODALITIES.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></td><td><input name="region" placeholder="منطقة جديدة"></td><td><input name="base_price" type="number" min="0" placeholder="السعر"></td><td></td><td><button class="btn sm ok">إضافة</button></td></form></tr></table></div>{% endblock %}
